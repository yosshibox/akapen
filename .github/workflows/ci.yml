name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Core (+ io) build and test on all three target OSes. The workspace-wide
  # `cargo build/test/clippy` here also compiles the .NET-side bindgen (a bin
  # crate) and the Node-side napi-rs crate, so a plain Rust break in either
  # binding fails this job on every platform.
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --verbose
      - name: Test (includes reference-vector ports)
        run: cargo test --workspace --verbose

  # Byte-identical parity of the two hand-written copies of the Akapen C ABI
  # header (spec §7.2). The canonical copy is `crates/akapen-ffi/include/akapen.h`;
  # `apps/mac/Sources/CAkapen/include/akapen.h` is the mirror SwiftPM reads.
  # Cheap and OS-independent, so this runs on ubuntu-latest even though one of
  # the two files sits under apps/mac/. A lone edit to one copy fails here on
  # the same push, before any face job wastes time linking the stale surface.
  header-parity:
    name: header parity (akapen.h)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diff crates/akapen-ffi/include/akapen.h and apps/mac/Sources/CAkapen/include/akapen.h
        run: bash scripts/check-header-parity.sh

  # Tri-face build discipline (spec §9 "M1 併走条件"). Each face compiles a
  # different consumer against the same C ABI in `crates/akapen-ffi`, so an
  # ABI-breaking change in the core fails at least one of the three faces on
  # the same push. The three faces are:
  #   mac-shell       — Rust static lib + SwiftUI shell + headless harness.
  #   bindings-dotnet — Rust cdylib + csbindgen-generated C# + .NET class lib.
  #   bindings-node   — napi-rs cdylib producing a loadable .node addon and
  #                    exercising the native AkapenSession API.
  #
  # The Node face's smoke gate loads the platform addon, drives varying pointer
  # pressure through AkapenSession, and verifies the three-file export.

  mac-shell:
    name: mac shell (swift + ffi)
    runs-on: macos-latest
    needs: header-parity
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build Rust C ABI (libakapen.a)
        run: cargo build -p akapen-ffi
      - name: Build the mac shell + harness
        run: swift build
        working-directory: apps/mac
      - name: Run the FFI proof harness (draw + 3-file export)
        run: swift run akapen-harness "$RUNNER_TEMP/akapen-review"
        working-directory: apps/mac
      - name: Assert the 3-file export exists
        run: |
          test -f "$RUNNER_TEMP/akapen-review/harness.review.png"
          test -f "$RUNNER_TEMP/akapen-review/harness.strokes.png"
          test -f "$RUNNER_TEMP/akapen-review/harness.strokes.json"

  bindings-dotnet:
    name: bindings / dotnet (csbindgen + .NET 8)
    runs-on: windows-latest
    needs: header-parity
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build the Rust C ABI (produces akapen.dll)
        run: cargo build -p akapen-ffi --release
      - name: Generate C# P/Invoke bindings via csbindgen
        run: cargo run -p akapen-dotnet-bindgen
      - name: Build the .NET class library (Akapen.Native)
        run: dotnet build bindings/dotnet/Akapen.Native/Akapen.Native.csproj -c Release
      - name: Build the P/Invoke smoke test (Akapen.SmokeTest)
        run: dotnet build bindings/dotnet/Akapen.SmokeTest/Akapen.SmokeTest.csproj -c Release
      - name: Place akapen.dll next to the smoke test binary
        # `dotnet build` never copies a native DLL it does not itself produce;
        # the P/Invoke [DllImport("akapen")] resolves it via the default probe
        # path, which includes the executable's own output directory.
        run: Copy-Item target\release\akapen.dll bindings\dotnet\Akapen.SmokeTest\bin\Release\net8.0\akapen.dll
      - name: Run the smoke test (loads akapen.dll and calls through it)
        # This is the actual regression the class-library build above cannot
        # catch: a wrong DLL name, a missing native dependency, or a struct
        # layout mismatch only fails here, at real P/Invoke call time.
        run: dotnet bindings\dotnet\Akapen.SmokeTest\bin\Release\net8.0\Akapen.SmokeTest.dll

  # Windows shell (spec §9 M2, first-cut). Only builds the WinUI 3 project —
  # actually running the shell needs Session 1 to reach a DX12 swapchain (same
  # limitation apps/windows-probe hits under Session 0 SSH), and `dotnet build`
  # cannot present a XAML window on a headless runner. The build alone still
  # catches every regression the shell is meant to catch here: XAML markup /
  # code-behind mismatches, .csproj drift against the WindowsAppSDK NuGet
  # package, and any accidental break of the shared generated binding source
  # consumed by the shell and Akapen.Native.
  apps-windows-shell:
    name: apps / windows shell (WinUI 3)
    runs-on: windows-latest
    needs: header-parity
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Build the Rust C ABI (produces akapen.dll)
        run: cargo build -p akapen-ffi --release
      - name: Generate C# P/Invoke bindings via csbindgen
        # The shell consumes the same csbindgen-generated NativeMethods the
        # bindings-dotnet job compiles — regenerate first so a Rust FFI drift
        # fails here as a compile error, not a runtime crash.
        run: cargo run -p akapen-dotnet-bindgen
      - name: Build the WinUI 3 shell (build only, no run)
        # Session 0 GitHub Actions runners cannot present a DX12 swapchain, so
        # the shell can only be *built* here. Real GUI verification (Open, draw,
        # save) is a manual .34 Session 1 step — see apps/windows/README.md.
        run: dotnet build apps/windows/AkapenApp/AkapenApp.csproj -c Release

  # Boundary-value tests for SettingsStore.cs (spec §4.7 / §9 M2-E). Added in
  # response to Codex 再レビュー Medium 2: a manual /tmp test harness existed
  # only on a dev machine and was never runnable from the repo or in CI.
  # SettingsStore.cs itself has zero WinUI / Windows App SDK dependency (see
  # its own header comment — only System.IO / System.Text.Json), so unlike
  # apps-windows-shell this job needs neither a windows-latest runner nor the
  # Rust FFI build; it runs the AkapenApp.Tests console project directly on
  # ubuntu-latest, which is the lighter/faster choice and keeps this
  # regression check independent of the WindowsAppSDK toolchain being
  # available at all.
  apps-windows-tests:
    name: apps / windows tests (SettingsStore)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run SettingsStore boundary-value tests
        run: dotnet run --project apps/windows/AkapenApp.Tests -c Release

  bindings-node:
    name: bindings / node (napi-rs, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: header-parity
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Install napi-rs CLI
        run: npm install --no-fund --no-audit
        working-directory: bindings/node
      - name: Build the napi-rs addon (.node)
        run: npm run build
        working-directory: bindings/node
      - name: Assert the platform .node binary exists
        run: >-
          node -e 'const fs = require("node:fs"); const tag = {darwin: "darwin", linux: "linux", win32: "win32"}[process.platform]; const suffix = process.platform === "linux" ? "-(?:gnu|musl)" : process.platform === "win32" ? "-msvc" : ""; const re = new RegExp("^akapen-core-node\\." + tag + "-" + process.arch + suffix + "\\.node$"); const files = fs.readdirSync(".").filter((name) => re.test(name)); if (!files.length) { console.error("napi build did not emit a platform .node binary"); console.error(fs.readdirSync(".").join("\\n")); process.exit(1); } console.log("produced: " + files.join(", "));'
        working-directory: bindings/node
      - name: Run the native AkapenSession smoke test
        working-directory: bindings/node
        run: npm run smoke
