[package]
name = "akapen-io"
description = "Akapen I/O helpers: image decode adapters, sequence detection, output naming, path normalization (M0 scaffold)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
# Image decode for png/jpg/webp/bmp backgrounds (spec §4.1). Pure-Rust default
# features keep the core cross-compilable; rationale documented in README.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
